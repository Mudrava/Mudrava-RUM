name: Feature request
description: Suggest a new metric, view or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem this solves
    validations: { required: true }
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Collector, Metrics, Live Monitor, Reports, Emails, Privacy, Other]
