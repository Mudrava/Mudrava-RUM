# Local integration stand for Mudrava RUM.
#
# Project name is fixed: tests/run.sh expects the container mdvrm-stand-wp-1 and
# tests/mu-plugin/stand-mailer.php delivers mail to mdvrm-stand-mailpit-1.
#
#   docker compose -f tests/docker-compose.stand.yml up -d
#   bash tests/bootstrap-stand.sh
#   bash tests/run.sh
#
# Site: http://localhost:8490  Mailpit UI: http://localhost:8491
name: mdvrm-stand

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --skip-name-resolve
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uwp", "-pwp"]
      interval: 5s
      timeout: 3s
      retries: 40
    volumes:
      - db_data:/var/lib/mysql

  wp:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', 'php://stderr');
        define('WP_DEBUG_DISPLAY', false);
        define('WP_SCRIPT_DEBUG', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_MODS', false);
        define('WP_HOME', 'http://localhost:8490');
        define('WP_SITEURL', 'http://localhost:8490');
    ports:
      - "127.0.0.1:8490:80"
    volumes:
      - wp_html:/var/www/html
      - ..:/var/www/dev
      - ../plugin:/var/www/html/wp-content/plugins/mudrava-rum
      - ./mu-plugin/stand-mailer.php:/var/www/html/wp-content/mu-plugins/stand-mailer.php:ro

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      wp:
        condition: service_started
      db:
        condition: service_healthy
    # The image entrypoint is wp itself, so keep the container alive for exec.
    entrypoint: ["tail", "-f", "/dev/null"]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
    volumes:
      - wp_html:/var/www/html
      - ..:/var/www/dev
      - ../plugin:/var/www/html/wp-content/plugins/mudrava-rum
      - ./mu-plugin/stand-mailer.php:/var/www/html/wp-content/mu-plugins/stand-mailer.php:ro

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8491:8025"
    networks:
      default:
        aliases:
          - mdvrm-stand-mailpit-1

networks:
  default:
    name: mdvrm-stand_default

volumes:
  db_data:
  wp_html:
